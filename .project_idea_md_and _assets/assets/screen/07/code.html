<!DOCTYPE html><html lang="en"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport">
<title>Wardrobe - Face Capture</title>
<!-- Tailwind CSS v3 with Plugins -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Google Fonts: Bodoni Moda & Inter -->
<link href="https://fonts.googleapis.com" rel="preconnect">
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect">
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..700;1,6..96,400..700&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet">
<script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            ivory: {
              DEFAULT: '#FBF9F5',
              surface: '#F5F2EA',
              border: '#E5E0D6'
            },
            charcoal: {
              DEFAULT: '#1A1715',
              muted: '#78716C'
            },
            terracotta: '#C06C54',
            sage: {
              DEFAULT: '#7D8B72',
              dark: '#6B7861'
            }
          },
          fontFamily: {
            serif: ['"Bodoni Moda"', 'serif'],
            sans: ['"Inter"', 'sans-serif']
          }
        }
      }
    }
  </script>
</head>
<body class="bg-stone-200 min-h-screen flex items-center justify-center p-0 sm:p-4 antialiased selection:bg-stone-300">
<!-- BEGIN: MobileDeviceFrame -->
<!-- Target screen container: 390px x 844px iOS viewport -->
<main class="w-[390px] h-[844px] bg-[#FBF9F5] text-charcoal flex flex-col justify-between p-6 shadow-2xl relative overflow-hidden sm:rounded-[44px] border border-stone-300/40" data-purpose="face-capture-screen">
<!-- Top App Bar & Typography Header -->
<div class="flex flex-col">
<!-- BEGIN: MainHeader -->
<header class="w-full text-center pt-2 pb-5" data-purpose="app-header">
<span class="text-[11px] uppercase tracking-[0.35em] font-medium text-charcoal select-none">
          W A R D R O B E
        </span>
</header>
<!-- END: MainHeader -->
<!-- BEGIN: TitleSection -->
<section class="mt-1" data-purpose="screen-title-section">
<!-- Category Pill & Accent Indicator -->
<div class="inline-flex flex-col items-start mb-2">
<span class="text-[11px] font-semibold tracking-widest text-charcoal-muted uppercase">
            FACE CAPTURE
          </span>
<div class="w-7 h-[2px] bg-terracotta mt-1 rounded-full"></div>
</div>
<!-- Editorial Headline -->
<h1 class="font-serif text-[32px] leading-[1.15] text-charcoal font-normal tracking-tight">
          Let’s capture<br>your face.
        </h1>
<!-- Concise Description -->
<p class="text-charcoal-muted font-sans text-[13px] leading-relaxed mt-2">
          Take a clear photo of your face in natural light.
        </p>
</section>
<!-- END: TitleSection -->
</div>
<!-- BEGIN: CameraPreviewArea -->
<!-- Large dominant viewport with facial framing aids -->
<div class="relative w-full flex-1 my-4 max-h-[440px] rounded-2xl overflow-hidden border border-ivory-border shadow-sm bg-neutral-100" data-purpose="camera-preview-container">
<!-- Primary Portrait Feed -->
<img alt="Clean studio portrait photography of an Asian woman with medium dark wavy hair, gentle soft natural makeup, calm direct gaze into the camera lens, front-facing camera preview perspective, wearing a simple cream textured top, soft natural daylight on warm off-white cream background, luxury fashion editorial aesthetic. Pure photography ONLY: zero text, zero overlays, zero lines, zero UI brackets, zero watermarks." class="w-full h-full object-cover object-center select-none pointer-events-none" src="https://lh3.googleusercontent.com/aida-public/AB6AXuBQI5b6Hjxm6DeslToY2nMoBfFqHOum9aQV6zxIQPfcoCir4FCojQ0VN9XhFLcOoi76Q0zI8V9pQtNs6VeMo5iXNaV2YkNlcopWkWdob2FSM78DlvUwf23W1L6r2R39nBkks6MBUbSTX-fZHk5ZrOzfwuImAAhd6dm5M0K0Z84oEAgSiNgu4Uo15S5DrUQhz2pMHJeu7ogiA55FIJFmPEoVObSSN-5ixsenjH3KAeAkJfHyspdWklem9Q">
<!-- Step / Angle Indicator Badge -->
<div class="absolute top-3.5 right-3.5 z-20">
<span class="px-2.5 py-1 rounded-full text-[10px] font-semibold tracking-wider text-charcoal bg-[#FBF9F5]/90 backdrop-blur-md shadow-xs border border-white/40">
          1 / 3 · FRONT
        </span>
</div>
<!-- BEGIN: FaceFramingGuides -->
<!-- Visual positioning overlay guides -->
<div aria-hidden="true" class="absolute inset-0 pointer-events-none flex items-center justify-center p-7">
<!-- Framing Target Container -->
<div class="relative w-full h-[320px] max-w-[260px] flex items-center justify-center">
<!-- Delicate Corner Brackets -->
<div class="absolute top-0 left-0 w-6 h-6 border-t-2 border-l-2 border-white/80 rounded-tl-sm shadow-xs"></div>
<div class="absolute top-0 right-0 w-6 h-6 border-t-2 border-r-2 border-white/80 rounded-tr-sm shadow-xs"></div>
<div class="absolute bottom-0 left-0 w-6 h-6 border-b-2 border-l-2 border-white/80 rounded-bl-sm shadow-xs"></div>
<div class="absolute bottom-0 right-0 w-6 h-6 border-b-2 border-r-2 border-white/80 rounded-br-sm shadow-xs"></div>
<!-- Subtle Oval Face Contour Guide -->
<div class="w-[190px] h-[255px] rounded-[50%] border border-dashed border-white/60"></div>
<!-- Minimal Center Crosshairs -->
<div class="absolute top-1/2 left-0 w-2.5 h-[1px] bg-white/70"></div>
<div class="absolute top-1/2 right-0 w-2.5 h-[1px] bg-white/70"></div>
<div class="absolute top-0 left-1/2 w-[1px] h-2.5 bg-white/70"></div>
<div class="absolute bottom-0 left-1/2 w-[1px] h-2.5 bg-white/70"></div>
</div>
</div>
<!-- END: FaceFramingGuides -->
</div>
<!-- END: CameraPreviewArea -->
<!-- BEGIN: FooterControls -->
<div class="flex flex-col gap-4 pb-1">
<!-- Guidance Hints Row -->
<section aria-label="Capture recommendations" class="flex items-center justify-between px-1" data-purpose="capture-guidance">
<!-- Hint 1 -->
<div class="flex items-center gap-1.5 text-charcoal">
<div class="w-4 h-4 rounded-full bg-sage/20 flex items-center justify-center shrink-0">
<svg class="w-2.5 h-2.5 text-sage-dark stroke-[2.5]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
<path d="M5 13l4 4L19 7" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</div>
<span class="text-[12px] font-medium text-stone-700">Good lighting</span>
</div>
<!-- Hint 2 -->
<div class="flex items-center gap-1.5 text-charcoal">
<div class="w-4 h-4 rounded-full bg-sage/20 flex items-center justify-center shrink-0">
<svg class="w-2.5 h-2.5 text-sage-dark stroke-[2.5]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
<path d="M5 13l4 4L19 7" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</div>
<span class="text-[12px] font-medium text-stone-700">Face visible</span>
</div>
<!-- Hint 3 -->
<div class="flex items-center gap-1.5 text-charcoal">
<div class="w-4 h-4 rounded-full bg-sage/20 flex items-center justify-center shrink-0">
<svg class="w-2.5 h-2.5 text-sage-dark stroke-[2.5]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
<path d="M5 13l4 4L19 7" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</div>
<span class="text-[12px] font-medium text-stone-700">Look straight</span>
</div>
</section>
<!-- Action Buttons -->
<div class="flex flex-col gap-2.5 pt-1" data-purpose="action-buttons">
<!-- Primary Action: Shutter Button -->
<button aria-label="Take Photo" class="w-full h-[52px] bg-sage hover:bg-sage-dark active:scale-[0.99] transition duration-150 rounded-xl flex items-center justify-center gap-2.5 text-white font-medium text-[13px] tracking-wider uppercase shadow-sm" type="button">
<svg class="w-[18px] h-[18px]" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
<path d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z" stroke-linecap="round" stroke-linejoin="round"></path>
<path d="M15 13a3 3 0 11-6 0 3 3 0 016 0z" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
<span>TAKE PHOTO</span>
</button>
<!-- Secondary Action: Upload Option -->
<button aria-label="Upload from gallery" class="w-full h-[46px] rounded-xl flex items-center justify-center gap-2 text-charcoal hover:bg-stone-100/60 active:bg-stone-200/50 transition duration-150 font-normal text-[13px] tracking-normal border border-transparent hover:border-ivory-border" type="button">
<svg class="w-4 h-4 text-stone-600" fill="none" stroke="currentColor" stroke-width="1.6" viewBox="0 0 24 24">
<path d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
<span>Upload from gallery</span>
</button>
</div>
</div>
<!-- END: FooterControls -->
</main>
<!-- END: MobileDeviceFrame -->
</body></html>
