<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WARDROBE - Face Capture / Upload (Screen 12)</title>
  <!-- Google Fonts: Bodoni Moda & Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..900;1,6..96,400..900&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: #141312;
      color: #1A1715;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
    }

    /* Top Control Bar for Device Sizing & State Controls */
    .top-controls {
      display: flex;
      gap: 12px;
      align-items: center;
      margin-bottom: 18px;
      flex-wrap: wrap;
      justify-content: center;
      z-index: 10;
    }

    .nav-btn, .size-btn, .reset-btn {
      background: #242220;
      color: #E5E0D6;
      border: 1px solid #383533;
      padding: 8px 14px;
      border-radius: 9999px;
      font-size: 11.5px;
      font-weight: 500;
      letter-spacing: 0.05em;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s ease;
      text-decoration: none;
    }

    .size-btn.active, .nav-btn:hover, .size-btn:hover, .reset-btn:hover {
      background: #7D8B72;
      color: #FFFFFF;
      border-color: #7D8B72;
    }

    /* Mobile Device Frame */
    .screen-container {
      position: relative;
      width: 390px;
      height: 844px;
      background: #FBF9F5;
      border-radius: 46px;
      overflow: hidden;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.55), 0 0 0 10px #242220;
      display: flex;
      flex-direction: column;
      transition: width 0.3s ease, height 0.3s ease;
    }

    .screen-container.size-compact {
      width: 360px;
      height: 800px;
      border-radius: 40px;
    }

    .screen-container.size-large {
      width: 412px;
      height: 915px;
      border-radius: 48px;
    }

    /* Android Status Bar */
    .status-bar {
      height: 38px;
      padding: 8px 24px 0 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 11px;
      font-weight: 600;
      color: #1A1715;
      letter-spacing: 0.02em;
      z-index: 15;
      flex-shrink: 0;
    }

    .status-icons {
      display: flex;
      gap: 5px;
      align-items: center;
    }

    /* Main Scrollable Content Area */
    .content-scroll {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 6px 24px 20px 24px;
      display: flex;
      flex-direction: column;
      scrollbar-width: none;
    }
    .content-scroll::-webkit-scrollbar {
      display: none;
    }

    /* Header Bar */
    .brand-header {
      width: 100%;
      text-align: center;
      padding-top: 2px;
      padding-bottom: 12px;
      position: relative;
    }

    .back-arrow-btn {
      position: absolute;
      left: 0;
      top: 2px;
      background: none;
      border: none;
      cursor: pointer;
      color: #1A1715;
      padding: 4px;
      display: flex;
      align-items: center;
      opacity: 0.7;
      transition: opacity 0.2s;
    }
    .back-arrow-btn:hover {
      opacity: 1;
    }

    .brand-wordmark {
      font-family: 'Inter', sans-serif;
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.35em;
      color: #1A1715;
      text-transform: uppercase;
      user-select: none;
    }

    /* Section Label & Terracotta Line */
    .section-label-group {
      display: inline-flex;
      flex-direction: column;
      align-items: flex-start;
      margin-bottom: 6px;
    }

    .section-label {
      font-family: 'Inter', sans-serif;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 1.1px;
      color: #78716C;
      text-transform: uppercase;
    }

    .terracotta-line {
      width: 28px;
      height: 2px;
      background: #C06C54;
      border-radius: 9999px;
      margin-top: 3px;
    }

    /* Editorial Headline */
    .editorial-headline {
      font-family: 'Bodoni Moda', serif;
      font-size: 32px;
      font-weight: 400;
      line-height: 1.15;
      letter-spacing: -0.32px;
      color: #1A1715;
      margin-top: 2px;
    }

    .description-text {
      font-family: 'Inter', sans-serif;
      font-size: 13px;
      font-weight: 400;
      line-height: 1.45;
      color: #78716C;
      margin-top: 5px;
      margin-bottom: 14px;
    }

    /* Large Camera Preview Viewport */
    .camera-viewport {
      position: relative;
      width: 100%;
      height: 400px;
      border-radius: 16px;
      overflow: hidden;
      border: 1px solid #E5E0D6;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.04);
      background: #F5F2EA;
      flex-shrink: 0;
    }

    .camera-viewport img, .camera-viewport video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      display: block;
      user-select: none;
      transition: opacity 0.25s ease;
    }

    /* Dynamic Step / Angle Badge */
    .angle-badge {
      position: absolute;
      top: 14px;
      right: 14px;
      background: rgba(251, 249, 245, 0.92);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.5);
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.08);
      border-radius: 9999px;
      padding: 5px 11px;
      font-family: 'Inter', sans-serif;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.8px;
      color: #1A1715;
      z-index: 20;
      transition: all 0.3s ease;
      white-space: nowrap;
    }

    .angle-badge.complete {
      background: rgba(125, 139, 114, 0.92);
      color: #FFFFFF;
      border-color: rgba(255, 255, 255, 0.3);
    }

    /* Face Framing Guides Overlay */
    .framing-overlay {
      position: absolute;
      inset: 0;
      pointer-events: none;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      z-index: 10;
    }

    .framing-box {
      position: relative;
      width: 260px;
      height: 320px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Delicate Corner Brackets (24px x 24px, 2px stroke, subtle curve) */
    .corner-bracket {
      position: absolute;
      width: 24px;
      height: 24px;
      border-color: rgba(255, 255, 255, 0.85);
      border-style: solid;
      pointer-events: none;
      filter: drop-shadow(0 1px 2px rgba(0,0,0,0.15));
    }
    .corner-tl {
      top: 0;
      left: 0;
      border-width: 2px 0 0 2px;
      border-top-left-radius: 3px;
    }
    .corner-tr {
      top: 0;
      right: 0;
      border-width: 2px 2px 0 0;
      border-top-right-radius: 3px;
    }
    .corner-bl {
      bottom: 0;
      left: 0;
      border-width: 0 0 2px 2px;
      border-bottom-left-radius: 3px;
    }
    .corner-br {
      bottom: 0;
      right: 0;
      border-width: 0 2px 2px 0;
      border-bottom-right-radius: 3px;
    }

    /* Subtle Dotted Oval Face Contour Guide (190px x 255px) */
    .face-oval {
      width: 190px;
      height: 255px;
      border-radius: 50%;
      border: 1.2px dashed rgba(255, 255, 255, 0.65);
      pointer-events: none;
      filter: drop-shadow(0 1px 2px rgba(0,0,0,0.12));
    }

    /* Minimal Center Crosshairs */
    .crosshair-left {
      position: absolute;
      left: 0;
      top: 50%;
      width: 10px;
      height: 1px;
      background: rgba(255, 255, 255, 0.7);
    }
    .crosshair-right {
      position: absolute;
      right: 0;
      top: 50%;
      width: 10px;
      height: 1px;
      background: rgba(255, 255, 255, 0.7);
    }
    .crosshair-top {
      position: absolute;
      top: 0;
      left: 50%;
      width: 1px;
      height: 10px;
      background: rgba(255, 255, 255, 0.7);
    }
    .crosshair-bottom {
      position: absolute;
      bottom: 0;
      left: 50%;
      width: 1px;
      height: 10px;
      background: rgba(255, 255, 255, 0.7);
    }

    /* Shutter Flash Animation Effect */
    .shutter-flash {
      position: absolute;
      inset: 0;
      background: #FFFFFF;
      opacity: 0;
      pointer-events: none;
      z-index: 30;
      transition: opacity 0.08s ease-out;
    }
    .shutter-flash.flashing {
      opacity: 0.9;
    }

    /* Quality Hint Guidance Row */
    .guidance-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 14px;
      padding: 0 4px;
    }

    .hint-item {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .hint-badge {
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: rgba(125, 139, 114, 0.2);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .hint-badge svg {
      width: 9px;
      height: 9px;
      stroke: #5D6B52;
      stroke-width: 2.2;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
    }

    .hint-label {
      font-size: 12px;
      font-weight: 500;
      color: #44403C;
    }

    /* Action Buttons */
    .action-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-top: 16px;
    }

    .btn-take-photo {
      width: 100%;
      height: 52px;
      background: #7D8B72;
      border: none;
      border-radius: 12px;
      color: #FFFFFF;
      font-family: 'Inter', sans-serif;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 1.2px;
      text-transform: uppercase;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      cursor: pointer;
      box-shadow: 0 3px 12px rgba(125, 139, 114, 0.28);
      transition: all 0.15s ease;
    }
    .btn-take-photo:hover {
      background: #6B7861;
      box-shadow: 0 4px 16px rgba(125, 139, 114, 0.35);
    }
    .btn-take-photo:active {
      transform: scale(0.985);
    }

    .btn-gallery {
      width: 100%;
      height: 44px;
      background: transparent;
      border: 1px solid transparent;
      border-radius: 10px;
      color: #1A1715;
      font-family: 'Inter', sans-serif;
      font-size: 13px;
      font-weight: 400;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .btn-gallery:hover {
      background: rgba(229, 224, 214, 0.4);
      border-color: #E5E0D6;
    }

    /* Horizontal Thumbnail Strip Section (YOUR PHOTOS) */
    .photos-strip-section {
      margin-top: 16px;
      padding-top: 6px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      animation: fadeIn 0.3s ease;
    }

    .strip-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .strip-title {
      font-size: 10.5px;
      font-weight: 600;
      letter-spacing: 1.2px;
      color: #78716C;
      text-transform: uppercase;
    }

    .strip-counter {
      font-size: 11px;
      font-weight: 400;
      color: #78716C;
    }

    .strip-row {
      display: flex;
      gap: 10px;
      overflow-x: auto;
      padding: 4px 2px 8px 2px;
      scrollbar-width: none;
    }
    .strip-row::-webkit-scrollbar {
      display: none;
    }

    .photo-thumb-card {
      position: relative;
      width: 68px;
      height: 88px;
      border-radius: 10px;
      overflow: hidden;
      background: #F0ECE3;
      border: 1px solid #E5E0D6;
      box-shadow: 0 2px 6px rgba(0,0,0,0.06);
      flex-shrink: 0;
      cursor: pointer;
      transition: transform 0.15s ease, border-color 0.15s ease;
    }
    .photo-thumb-card:hover {
      transform: translateY(-2px);
      border-color: #7D8B72;
    }

    .photo-thumb-card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .thumb-angle-tag {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      background: rgba(26, 23, 21, 0.75);
      color: #FFFFFF;
      font-size: 8px;
      font-weight: 600;
      letter-spacing: 0.5px;
      text-align: center;
      padding: 2px 0;
      text-transform: uppercase;
    }

    .thumb-delete-btn {
      position: absolute;
      top: 3px;
      right: 3px;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: rgba(26, 23, 21, 0.8);
      color: #FFFFFF;
      font-size: 11px;
      font-weight: bold;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      line-height: 1;
      opacity: 0.85;
      transition: opacity 0.15s, transform 0.15s;
    }
    .thumb-delete-btn:hover {
      opacity: 1;
      transform: scale(1.15);
      background: #C06C54;
    }

    .add-photo-card {
      width: 68px;
      height: 88px;
      border-radius: 10px;
      background: rgba(247, 244, 238, 0.5);
      border: 1px dashed #D6CEBE;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      cursor: pointer;
      color: #7D8B72;
      transition: all 0.15s ease;
    }
    .add-photo-card:hover {
      background: rgba(125, 139, 114, 0.08);
      border-color: #7D8B72;
      transform: translateY(-2px);
    }
    .add-photo-plus {
      font-size: 22px;
      font-weight: 300;
      line-height: 1;
    }
    .add-photo-text {
      font-size: 8px;
      font-weight: 600;
      letter-spacing: 0.6px;
      margin-top: 2px;
    }

    /* Continue Button Section */
    .continue-section {
      margin-top: 18px;
      padding-bottom: 4px;
      animation: fadeIn 0.4s ease;
    }

    .btn-continue {
      width: 100%;
      height: 52px;
      background: #7D8B72;
      border: none;
      border-radius: 9999px;
      color: #FFFFFF;
      font-family: 'Inter', sans-serif;
      font-size: 13.5px;
      font-weight: 600;
      letter-spacing: 1.3px;
      text-transform: uppercase;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(125, 139, 114, 0.35);
      transition: all 0.2s ease;
    }
    .btn-continue:hover {
      background: #6B7861;
      box-shadow: 0 6px 18px rgba(125, 139, 114, 0.45);
    }
    .btn-continue:active {
      transform: scale(0.985);
    }

    .btn-continue.disabled {
      background: #D1CBC1;
      box-shadow: none;
      cursor: not-allowed;
      opacity: 0.65;
    }

    /* Android Home Indicator Bar */
    .home-indicator {
      width: 134px;
      height: 5px;
      background: #1A1715;
      opacity: 0.2;
      border-radius: 10px;
      margin: 10px auto 6px auto;
      flex-shrink: 0;
    }

    /* Toast Notification */
    .toast-msg {
      position: absolute;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(30px);
      background: rgba(26, 23, 21, 0.92);
      color: #FFFFFF;
      padding: 10px 18px;
      border-radius: 9999px;
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 0.3px;
      opacity: 0;
      pointer-events: none;
      transition: all 0.3s ease;
      z-index: 100;
      box-shadow: 0 8px 24px rgba(0,0,0,0.25);
      white-space: nowrap;
    }
    .toast-msg.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <!-- Top Preview Device Switcher & Quick Test Controls -->
  <div class="top-controls">
    <a href="understand_your_face_preview.html" class="nav-btn">← Back to Screen 10</a>
    <button class="size-btn active" onclick="setSize('standard', this)">390 × 844 (Standard)</button>
    <button class="size-btn" onclick="setSize('compact', this)">360 × 800 (Compact)</button>
    <button class="size-btn" onclick="setSize('large', this)">412 × 915 (Large)</button>
    <button class="reset-btn" onclick="resetDemo()">↺ Reset Demo</button>
    <a href="app_flow_preview.html" class="nav-btn">Full Flow Preview →</a>
  </div>

  <!-- Mobile Device Container -->
  <main class="screen-container" id="deviceContainer">
    <!-- Android Status Bar -->
    <div class="status-bar">
      <span>9:41</span>
      <div class="status-icons">
        <svg width="15" height="11" viewBox="0 0 15 11" fill="currentColor">
          <path d="M0 10.5h2.5V8H0v2.5zm4-4h2.5V3H4v3.5zm4-3.5h2.5V0H8v3zm4 7.5h2.5V0H12v10.5z"/>
        </svg>
        <svg width="15" height="11" viewBox="0 0 15 11" fill="currentColor">
          <path d="M7.5 2C4.5 2 1.9 3.3 0 5.4L7.5 13 15 5.4C13.1 3.3 10.5 2 7.5 2z"/>
        </svg>
        <svg width="22" height="11" viewBox="0 0 22 11" fill="currentColor">
          <rect x="0" y="0.5" width="19" height="10" rx="2.5" fill="none" stroke="currentColor" stroke-width="1.2"/>
          <rect x="2" y="2.5" width="13" height="6" rx="1.5"/>
          <path d="M20.5 3.5v4" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/>
        </svg>
      </div>
    </div>

    <!-- Scrollable Content -->
    <div class="content-scroll" id="contentScroll">


      <!-- Section Label -->
      <section class="section-label-group">
        <span class="section-label">FACE CAPTURE</span>
        <div class="terracotta-line"></div>
      </section>

      <!-- Editorial Headline -->
      <h1 class="editorial-headline">Let’s capture<br>your face.</h1>

      <!-- Subtitle Description -->
      <p class="description-text">Take a clear photo of your face in natural light.</p>

      <!-- Dominant Camera Viewport -->
      <div class="camera-viewport" id="cameraViewport">
        <!-- Shutter Flash Overlay -->
        <div class="shutter-flash" id="shutterFlash"></div>

        <!-- Camera Portrait Feed -->
        <img id="previewImage" src="face_capture_demo.png" alt="Clean Camera Viewport Preview">
        <video id="webcamVideo" autoplay playsinline muted style="display: none;"></video>

        <!-- Dynamic Step / Angle Badge -->
        <div class="angle-badge" id="stepAngleBadge">1 / 3 · FRONT</div>

        <!-- Framing Overlay with Brackets & Dashed Oval -->
        <div class="framing-overlay" aria-hidden="true">
          <div class="framing-box">
            <!-- 4 Corner Brackets -->
            <div class="corner-bracket corner-tl"></div>
            <div class="corner-bracket corner-tr"></div>
            <div class="corner-bracket corner-bl"></div>
            <div class="corner-bracket corner-br"></div>

            <!-- Soft Oval Face Contour -->
            <div class="face-oval"></div>

            <!-- Minimal Center Crosshairs -->
            <div class="crosshair-left"></div>
            <div class="crosshair-right"></div>
            <div class="crosshair-top"></div>
            <div class="crosshair-bottom"></div>
          </div>
        </div>
      </div>

      <!-- Guidance Hints Row -->
      <div class="guidance-row">
        <div class="hint-item">
          <div class="hint-badge">
            <svg viewBox="0 0 24 24"><path d="M5 13l4 4L19 7"></path></svg>
          </div>
          <span class="hint-label">Good lighting</span>
        </div>
        <div class="hint-item">
          <div class="hint-badge">
            <svg viewBox="0 0 24 24"><path d="M5 13l4 4L19 7"></path></svg>
          </div>
          <span class="hint-label">Face visible</span>
        </div>
        <div class="hint-item">
          <div class="hint-badge">
            <svg viewBox="0 0 24 24"><path d="M5 13l4 4L19 7"></path></svg>
          </div>
          <span class="hint-label">Look straight</span>
        </div>
      </div>

      <!-- Action Buttons -->
      <div class="action-group">
        <!-- Primary Button: TAKE PHOTO -->
        <button type="button" class="btn-take-photo" id="btnTakePhoto" onclick="handleTakePhoto()">
          <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
            <path d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z" stroke-linecap="round" stroke-linejoin="round"></path>
            <circle cx="12" cy="13" r="3.5" stroke-linecap="round" stroke-linejoin="round"></circle>
          </svg>
          <span>TAKE PHOTO</span>
        </button>

        <!-- Secondary Button: Upload from gallery -->
        <button type="button" class="btn-gallery" onclick="document.getElementById('galleryInput').click()">
          <svg width="16" height="16" fill="none" stroke="#57534E" stroke-width="1.6" viewBox="0 0 24 24">
            <path d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z" stroke-linecap="round" stroke-linejoin="round"></path>
          </svg>
          <span>Upload from gallery</span>
        </button>
        <input type="file" id="galleryInput" multiple accept="image/*" style="display:none;" onchange="handleGalleryUpload(event)">
      </div>

      <!-- Horizontal Photo Strip (YOUR PHOTOS) -->
      <div class="photos-strip-section" id="photosStripSection" style="display: none;">
        <div class="strip-header">
          <span class="strip-title">YOUR PHOTOS</span>
          <span class="strip-counter" id="photoCounterText">0 captured</span>
        </div>
        <div class="strip-row" id="photoThumbnailRow">
          <!-- Thumbnail Cards dynamically injected -->
          <div class="add-photo-card" onclick="handleTakePhoto()" title="Add another photo">
            <span class="add-photo-plus">+</span>
            <span class="add-photo-text">ADD</span>
          </div>
        </div>
      </div>

      <!-- Continue Action Section (Enabled when 3+ views are captured) -->
      <div class="continue-section" id="continueSection" style="display: none;">
        <button type="button" class="btn-continue" onclick="handleContinue()">
          <span>CONTINUE</span>
          <span>→</span>
        </button>
      </div>
    </div>

    <!-- Android Home Navigation Indicator -->
    <div class="home-indicator"></div>

    <!-- Toast Notification Message -->
    <div class="toast-msg" id="toastMsg">Photo captured</div>
  </main>

  <script>
    // Guided Angles Sequence
    const guidedAngles = [
      { step: 1, label: 'FRONT' },
      { step: 2, label: 'LEFT' },
      { step: 3, label: 'RIGHT' }
    ];

    let capturedPhotos = [];
    const defaultDemoImage = 'face_capture_demo.png';

    // Elements
    const previewImage = document.getElementById('previewImage');
    const stepAngleBadge = document.getElementById('stepAngleBadge');
    const shutterFlash = document.getElementById('shutterFlash');
    const photosStripSection = document.getElementById('photosStripSection');
    const photoThumbnailRow = document.getElementById('photoThumbnailRow');
    const photoCounterText = document.getElementById('photoCounterText');
    const continueSection = document.getElementById('continueSection');
    const contentScroll = document.getElementById('contentScroll');
    const toastMsg = document.getElementById('toastMsg');

    // Show Toast
    function showToast(msg) {
      toastMsg.textContent = msg;
      toastMsg.classList.add('show');
      setTimeout(() => {
        toastMsg.classList.remove('show');
      }, 2400);
    }

    // Trigger Camera Flash & Sound simulation
    function triggerFlash() {
      shutterFlash.classList.add('flashing');
      setTimeout(() => {
        shutterFlash.classList.remove('flashing');
      }, 100);
    }

    // Handle Take Photo Action
    function handleTakePhoto() {
      triggerFlash();

      const nextIndex = capturedPhotos.length;
      let angle = 'ADDITIONAL';
      if (nextIndex === 0) angle = 'FRONT';
      else if (nextIndex === 1) angle = 'LEFT';
      else if (nextIndex === 2) angle = 'RIGHT';
      else angle = (nextIndex % 2 === 1) ? 'LEFT' : 'RIGHT';

      // Capture photo data (using demo or canvas)
      const photoObj = {
        id: 'photo_' + Date.now() + '_' + Math.random().toString(36).substr(2, 5),
        src: defaultDemoImage,
        angle: angle
      };

      capturedPhotos.push(photoObj);
      renderState();
      showToast(`Captured ${angle} view`);

      // Scroll to reveal thumbnails if first photo
      if (capturedPhotos.length === 1) {
        setTimeout(() => {
          contentScroll.scrollTo({ top: 180, behavior: 'smooth' });
        }, 150);
      } else if (capturedPhotos.length === 3) {
        setTimeout(() => {
          contentScroll.scrollTo({ top: 300, behavior: 'smooth' });
        }, 150);
      }
    }

    // Handle Gallery Upload with Multiple Selection
    function handleGalleryUpload(e) {
      const files = e.target.files;
      if (!files || files.length === 0) return;

      Array.from(files).forEach((file, i) => {
        const reader = new FileReader();
        reader.onload = function(evt) {
          const nextIndex = capturedPhotos.length;
          let angle = 'ADDITIONAL';
          if (nextIndex === 0) angle = 'FRONT';
          else if (nextIndex === 1) angle = 'LEFT';
          else if (nextIndex === 2) angle = 'RIGHT';

          const photoObj = {
            id: 'photo_' + Date.now() + '_' + Math.random().toString(36).substr(2, 5),
            src: evt.target.result,
            angle: angle
          };
          capturedPhotos.push(photoObj);
          renderState();
        };
        reader.readAsDataURL(file);
      });

      showToast(`Added ${files.length} photo${files.length > 1 ? 's' : ''} from gallery`);
      e.target.value = '';
    }

    // Remove an individual photo
    function removePhoto(id, e) {
      if (e) e.stopPropagation();
      capturedPhotos = capturedPhotos.filter(p => p.id !== id);
      renderState();
      showToast('Photo removed');
    }

    // Select thumbnail to view in main viewport
    function selectPhoto(src) {
      previewImage.src = src;
    }

    // Update UI State & Guidance
    function renderState() {
      const count = capturedPhotos.length;

      // 1. Update Angle Badge
      if (count === 0) {
        stepAngleBadge.textContent = '1 / 3 · FRONT';
        stepAngleBadge.classList.remove('complete');
        previewImage.src = defaultDemoImage;
      } else if (count === 1) {
        stepAngleBadge.textContent = '2 / 3 · LEFT';
        stepAngleBadge.classList.remove('complete');
        previewImage.src = capturedPhotos[0].src;
      } else if (count === 2) {
        stepAngleBadge.textContent = '3 / 3 · RIGHT';
        stepAngleBadge.classList.remove('complete');
        previewImage.src = capturedPhotos[1].src;
      } else {
        stepAngleBadge.textContent = '3 / 3 · COMPLETE';
        stepAngleBadge.classList.add('complete');
        previewImage.src = capturedPhotos[capturedPhotos.length - 1].src;
      }

      // 2. Update Photo Strip
      if (count > 0) {
        photosStripSection.style.display = 'flex';
        photoCounterText.textContent = `${count} captured`;

        let html = '';
        capturedPhotos.forEach((photo) => {
          html += `
            <div class="photo-thumb-card" onclick="selectPhoto('${photo.src}')">
              <img src="${photo.src}" alt="${photo.angle}">
              <div class="thumb-angle-tag">${photo.angle}</div>
              <button class="thumb-delete-btn" onclick="removePhoto('${photo.id}', event)" title="Remove photo">×</button>
            </div>
          `;
        });

        // Add Photo Plus Tile
        html += `
          <div class="add-photo-card" onclick="handleTakePhoto()" title="Add another photo">
            <span class="add-photo-plus">+</span>
            <span class="add-photo-text">ADD</span>
          </div>
        `;

        photoThumbnailRow.innerHTML = html;
      } else {
        photosStripSection.style.display = 'none';
      }

      // 3. Continue Button Enablement (3+ photos)
      if (count >= 3) {
        continueSection.style.display = 'block';
      } else {
        continueSection.style.display = 'none';
      }
    }

    // Handle Continue Click
    function handleContinue() {
      showToast('✓ Coverage complete! Advancing to Body/Silhouette Analysis...');
      setTimeout(() => {
        alert('Face Capture complete!\nTotal photos: ' + capturedPhotos.length + '\nReady to proceed to next stage: Silhouette / Body Analysis.');
      }, 500);
    }

    // Reset Demo
    function resetDemo() {
      capturedPhotos = [];
      renderState();
      contentScroll.scrollTo({ top: 0, behavior: 'smooth' });
      showToast('Demo reset to initial state');
    }

    // Device Size Switcher
    function setSize(size, btn) {
      document.querySelectorAll('.size-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      const container = document.getElementById('deviceContainer');
      container.classList.remove('size-compact', 'size-large');
      if (size === 'compact') {
        container.classList.add('size-compact');
      } else if (size === 'large') {
        container.classList.add('size-large');
      }
    }
  </script>
</body>
</html>
