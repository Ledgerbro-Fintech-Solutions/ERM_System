<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WARDROBE - Opening Screen Preview</title>
  <style>
    @font-face {
      font-family: 'Bodoni Moda';
      src: url('./fonts/bodoni_moda_regular.ttf') format('truetype');
      font-weight: 400;
      font-style: normal;
    }
    @font-face {
      font-family: 'Bodoni Moda';
      src: url('./fonts/bodoni_moda_italic.ttf') format('truetype');
      font-weight: 400;
      font-style: italic;
    }
    @font-face {
      font-family: 'Inter';
      src: url('./fonts/inter_regular.otf') format('opentype');
      font-weight: 400;
      font-style: normal;
    }
    @font-face {
      font-family: 'Inter';
      src: url('./fonts/inter_semibold.otf') format('opentype');
      font-weight: 600;
      font-style: normal;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: #12100E;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      font-family: 'Inter', -apple-system, sans-serif;
    }

    .device-shell {
      position: relative;
      width: 390px;
      height: 844px;
      background: #F7F4EE;
      border-radius: 44px;
      overflow: hidden;
      box-shadow: 0 25px 60px -15px rgba(0, 0, 0, 0.7), 0 0 0 1px rgba(255, 255, 255, 0.08);
    }

    .hero-image {
      position: absolute;
      top: 48px;
      left: 0;
      width: 100%;
      height: calc(100% - 48px);
      object-fit: cover;
      object-position: center top;
      z-index: 1;
    }

    /* Top atmospheric warm ivory scrim */
    .scrim-top {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 270px;
      background: linear-gradient(
        to bottom,
        rgba(247, 244, 238, 0.98) 0%,
        rgba(247, 244, 238, 0.88) 45%,
        rgba(247, 244, 238, 0.45) 80%,
        rgba(247, 244, 238, 0) 100%
      );
      z-index: 2;
      pointer-events: none;
    }

    /* Bottom atmospheric warm ivory scrim */
    .scrim-bottom {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 250px;
      background: linear-gradient(
        to top,
        rgba(247, 244, 238, 0.96) 0%,
        rgba(247, 244, 238, 0.70) 55%,
        rgba(247, 244, 238, 0) 100%
      );
      z-index: 2;
      pointer-events: none;
    }

    .screen-content {
      position: relative;
      z-index: 3;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: 46px 24px 34px 24px;
      text-align: center;
    }

    .brand-wordmark {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.42em;
      text-transform: uppercase;
      color: #1A1715;
      margin-bottom: 16px;
      padding-left: 0.42em; /* offset letter-spacing for true center */
    }

    .editorial-headline {
      font-family: 'Bodoni Moda', serif;
      font-size: 38px;
      line-height: 1.08;
      color: #1A1715;
      letter-spacing: -0.01em;
      font-weight: 400;
    }

    .editorial-headline .italic {
      font-style: italic;
    }

    .supporting-copy {
      font-family: 'Inter', sans-serif;
      font-size: 13px;
      line-height: 1.4;
      color: #5A5652;
      max-width: 260px;
      margin-top: 12px;
    }

    .spacer {
      flex: 1;
      pointer-events: none;
    }

    .bottom-controls {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 15px;
    }

    .primary-cta {
      width: 100%;
      max-width: 280px;
      height: 52px;
      background-color: #6D7962;
      color: #FFFFFF;
      font-size: 15px;
      font-weight: 500;
      border: none;
      border-radius: 9999px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      cursor: pointer;
      box-shadow: 0 8px 20px rgba(26, 23, 21, 0.18);
      transition: transform 0.15s ease, background-color 0.15s ease;
    }

    .primary-cta:hover {
      background-color: #5E6953;
    }

    .primary-cta:active {
      transform: scale(0.982);
    }

    .arrow-icon {
      width: 16px;
      height: 16px;
    }

    .account-link {
      background: none;
      border: none;
      font-family: 'Inter', sans-serif;
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: rgba(26, 23, 21, 0.8);
      cursor: pointer;
      padding: 4px 10px;
      transition: color 0.15s ease;
    }

    .account-link:hover {
      color: #1A1715;
    }

    .indicator-container {
      display: flex;
      align-items: center;
      gap: 6px;
      padding-top: 2px;
    }

    .indicator-pill {
      height: 3.5px;
      border-radius: 9999px;
    }

    .indicator-pill.active {
      width: 24px;
      background-color: #6D7962;
    }

    .indicator-pill.inactive {
      width: 20px;
      background-color: rgba(26, 23, 21, 0.20);
    }

    .meta-bar {
      margin-top: 18px;
      color: #A8A29E;
      font-size: 13px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .meta-tag {
      background: rgba(255, 255, 255, 0.08);
      padding: 4px 10px;
      border-radius: 6px;
      color: #E7E5E4;
      font-size: 12px;
    }
  </style>
</head>
<body>

  <div class="device-shell">
    <img class="hero-image" src="background.png" alt="WARDROBE Hero">
    <div class="scrim-top"></div>
    <div class="scrim-bottom"></div>

    <div class="screen-content">
      <header>
        <h1 class="editorial-headline">
          Your style,<br>
          <span class="italic">smarter.</span>
        </h1>
        <p class="supporting-copy">
          AI-powered style recommendations<br>for your unique style.
        </p>
      </header>

      <div class="spacer"></div>

      <div class="bottom-controls">
        <button class="primary-cta" type="button">
          <span>Get Started</span>
          <svg class="arrow-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="3" y1="12" x2="21" y2="12"></line>
            <polyline points="13.5 4.5 21 12 13.5 19.5"></polyline>
          </svg>
        </button>

        <button class="account-link" type="button">
          I ALREADY HAVE AN ACCOUNT
        </button>

        <div class="indicator-container" aria-label="3-step progress">
          <div class="indicator-pill active"></div>
          <div class="indicator-pill inactive"></div>
          <div class="indicator-pill inactive"></div>
        </div>
      </div>
    </div>
  </div>

  <div class="meta-bar">
    <span>Viewport: 390 × 844 px</span>
    <span class="meta-tag">Opening Screen</span>
    <span>Zero Emulator / Zero Phone Needed</span>
  </div>

</body>
</html>
